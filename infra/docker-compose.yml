services:
  postgres:
    image: postgres:16-alpine
    container_name: oddly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oddly
      POSTGRES_PASSWORD: oddlypass
      POSTGRES_DB: oddly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Cache Role: content, config, Drop JSON, rate limits (allkeys-lru eviction)
  redis-cache:
    image: redis:7-alpine
    container_name: oddly-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_cache_data:/data

  # Redis Counters Role: live answer frequencies, buckets, idempotency locks (noeviction + AOF)
  redis-counters:
    image: redis:7-alpine
    container_name: oddly-redis-counters
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_counters_data:/data

  # Redis Queue Role: BullMQ workers & jobs (noeviction + AOF)
  redis-queue:
    image: redis:7-alpine
    container_name: oddly-redis-queue
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - redis_queue_data:/data

volumes:
  postgres_data:
  redis_data:
  redis_cache_data:
  redis_counters_data:
  redis_queue_data:

