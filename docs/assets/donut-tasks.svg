<svg xmlns="http://www.w3.org/2000/svg" width="460" height="260" viewBox="0 0 460 260">
  <title>Tasks Distribution: 241 Done, 169 To Do</title>
  <desc>Donut chart: Done 241, In Progress 0, Blocked 0, Pending 169, Total 410.</desc>
  <style>
    .val { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 900; fill: #14123A; }
    .lbl { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #5B5780; letter-spacing: 0.5px; }
    .leg { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #14123A; }
    .card-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 800; fill: #14123A; }
  </style>

  
    <rect x="14" y="14" width="436" height="236" rx="14" fill="#14123A" />
    <rect x="10" y="10" width="436" height="236" rx="14" fill="#FFFFFF" stroke="#14123A" stroke-width="2.5" />
  

  <!-- Background Track Outline -->
  <circle cx="130" cy="130" r="80" fill="none" stroke="#14123A" stroke-width="39" />
  <circle cx="130" cy="130" r="80" fill="none" stroke="#EEEAFE" stroke-width="34" />

  <!-- Done Slice (Mint) -->
  <circle cx="130" cy="130" r="80" fill="none" stroke="#3DDBB0" stroke-width="34"
          stroke-dasharray="295.46 502.65"
          transform="rotate(-90 130 130)" />

  <!-- Inner Cutout Fill -->
  <circle cx="130" cy="130" r="62" fill="#FFFFFF" stroke="#14123A" stroke-width="2.5" />

  <!-- Center Text -->
  <text x="130" y="132" class="val" text-anchor="middle">410</text>
  <text x="130" y="149" class="lbl" text-anchor="middle">TOTAL TASKS</text>

  <!-- Legend -->
  <text x="260" y="44" class="card-title">STATUS BREAKDOWN</text>

  <!-- Done item -->
  <rect x="260" y="60" width="16" height="16" rx="4" fill="#3DDBB0" stroke="#14123A" stroke-width="2" />
  <text x="286" y="73" class="leg">Done: <tspan font-weight="800">241</tspan> (59%)</text>

  <!-- Todo item -->
  <rect x="260" y="92" width="16" height="16" rx="4" fill="#EEEAFE" stroke="#14123A" stroke-width="2" />
  <text x="286" y="105" class="leg">To Do: <tspan font-weight="800">169</tspan> (41%)</text>

  <!-- In Progress item -->
  <rect x="260" y="124" width="16" height="16" rx="4" fill="#FFD23F" stroke="#14123A" stroke-width="2" />
  <text x="286" y="137" class="leg">In Progress: <tspan font-weight="800">0</tspan></text>

  <!-- Blocked item -->
  <rect x="260" y="156" width="16" height="16" rx="4" fill="#FF6B5E" stroke="#14123A" stroke-width="2" />
  <text x="286" y="169" class="leg">Blocked: <tspan font-weight="800">0</tspan></text>

  <!-- Reliability stamp pill -->
  <rect x="262" y="194" width="160" height="26" rx="13" fill="#14123A" />
  <rect x="260" y="192" width="160" height="26" rx="13" fill="#FFF8F0" stroke="#14123A" stroke-width="2" />
  <text x="340" y="209" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" font-weight="800" fill="#14123A" text-anchor="middle">★ HONEST ESTIMATE</text>
</svg>
